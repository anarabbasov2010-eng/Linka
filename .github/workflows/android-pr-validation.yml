name: Android PR validation
on:
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-pr-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Run Android unit tests and compile debug APK
        working-directory: apps/android
        run: gradle testDebugUnitTest assembleDebug
