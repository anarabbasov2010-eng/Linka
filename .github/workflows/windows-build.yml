name: Windows desktop release
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: windows-installers
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: Set standalone Windows version
        shell: pwsh
        run: |
          $version = "0.5.$env:GITHUB_RUN_NUMBER"
          $tag = "v$version"
          "LINKA_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VITE_LINKA_DESKTOP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $versionFiles = @("apps/web/package.json", "apps/desktop/package.json", "apps/desktop/src-tauri/tauri.conf.json")
          foreach ($relativePath in $versionFiles) {
            $path = Join-Path $env:GITHUB_WORKSPACE $relativePath
            $manifest = Get-Content -Raw $path | ConvertFrom-Json
            $manifest.version = $version
            $manifest | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8 $path
          }
          $cargoPath = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/Cargo.toml"
          $cargo = Get-Content -Raw $cargoPath
          $cargo = [regex]::Replace($cargo, '(?m)^version = "[^"]+"$', "version = `"$version`"", 1)
          Set-Content -Path $cargoPath -Value $cargo -Encoding utf8
          Write-Host "Building Linka Windows $version with synchronized manifests and no mobile-release dependency."

      - name: Inject public cloud endpoint when configured
        shell: pwsh
        env:
          LINKA_SUPABASE_URL: ${{ vars.LINKA_SUPABASE_URL }}
          LINKA_SUPABASE_PUBLISHABLE_KEY: ${{ vars.LINKA_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          "LINKA_SUPABASE_URL=$($env:LINKA_SUPABASE_URL)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LINKA_SUPABASE_PUBLISHABLE_KEY=$($env:LINKA_SUPABASE_PUBLISHABLE_KEY)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($env:LINKA_SUPABASE_URL -and $env:LINKA_SUPABASE_PUBLISHABLE_KEY) {
            Write-Host "Configured the public Linka cloud endpoint for the build."
          } else {
            Write-Warning "Linka cloud endpoint is not configured. Local-only mode remains available."
          }

      - name: Configure signed Windows updates when signing keys exist
        shell: pwsh
        env:
          LINKA_UPDATER_PUBLIC_KEY: ${{ vars.LINKA_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $updaterEnabled = $false
          "LINKA_UPDATER_ENABLED=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $configPath = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/tauri.conf.json"
          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          if ($env:LINKA_UPDATER_PUBLIC_KEY -and $env:TAURI_SIGNING_PRIVATE_KEY) {
            $updater = [ordered]@{
              pubkey = $env:LINKA_UPDATER_PUBLIC_KEY
              endpoints = @("https://github.com/anarabbasov2010-eng/Linka/releases/latest/download/latest.json")
              windows = @{ installMode = "passive" }
            }
            $plugins = [ordered]@{}
            if ($config.plugins) {
              foreach ($property in $config.plugins.PSObject.Properties) {
                $plugins[$property.Name] = $property.Value
              }
            }
            $plugins["updater"] = $updater
            $config | Add-Member -MemberType NoteProperty -Name plugins -Value ([pscustomobject]$plugins) -Force
            $config.bundle.createUpdaterArtifacts = $true
            $updaterEnabled = $true
            "LINKA_UPDATER_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Signed Linka desktop auto-updater is enabled."
          } else {
            $config.bundle.createUpdaterArtifacts = $false
            Write-Warning "Signed in-app updating is disabled until LINKA_UPDATER_PUBLIC_KEY and TAURI_SIGNING_PRIVATE_KEY are configured."
          }
          "VITE_LINKA_UPDATER_ENABLED=$($updaterEnabled.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $config | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8 $configPath

      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Install desktop tooling
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Generate Windows app icons
        working-directory: apps/desktop
        run: npx tauri icon ../web/public/linka-mark.svg --output src-tauri/icons
      - name: Test Web and Windows-shared UI
        working-directory: apps/web
        run: npm test
      - name: Build Windows installer
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build

      - name: Smoke-test Windows startup
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/target/release/linka-desktop.exe"
          if (-not (Test-Path $exe)) { throw "The built Linka executable was not found at $exe" }
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            $diagnosticPaths = @(
              (Join-Path $env:LOCALAPPDATA "Linka\logs\startup.log"),
              (Join-Path $env:TEMP "Linka\startup.log")
            )
            foreach ($logPath in $diagnosticPaths) {
              if (Test-Path $logPath) {
                Write-Host "---- Linka startup diagnostics: $logPath ----"
                Get-Content -Raw $logPath
              }
            }
            throw "Linka exited during the startup smoke test (exit code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linka-Windows-x64-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows-only release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=(apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if [[ ! -f "${files[0]:-}" ]]; then
            echo "::error::No Windows NSIS installer was produced."
            exit 1
          fi
          cp "${files[0]}" Linka-Windows-x64-setup.exe
          version="${LINKA_RELEASE_TAG#v}"
          if gh release view "$LINKA_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$LINKA_RELEASE_TAG" Linka-Windows-x64-setup.exe --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$LINKA_RELEASE_TAG" Linka-Windows-x64-setup.exe \
              --title "Linka for Windows $version" \
              --notes "Linka desktop release $version. Windows and Web only; standalone Windows installer includes the WebView2 bootstrapper."
          fi
          if [[ "${LINKA_UPDATER_ENABLED:-false}" == "true" ]]; then
            bundles=(apps/desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip)
            if [[ ! -f "${bundles[0]:-}" || ! -f "${bundles[0]}.sig" ]]; then
              echo "::error::Signed updater archive or signature is missing."
              exit 1
            fi
            updater_zip="${bundles[0]}"
            signature_file="${updater_zip}.sig"
            signature="$(cat "$signature_file")"
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$LINKA_RELEASE_TAG/$(basename "$updater_zip")"
            jq -n --arg version "$version" --arg notes "Linka $version" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg url "$url" --arg signature "$signature" '{
              version: $version,
              notes: $notes,
              pub_date: $date,
              platforms: {
                "windows-x86_64": { signature: $signature, url: $url }
              }
            }' > latest.json
            gh release upload "$LINKA_RELEASE_TAG" "$updater_zip" "$signature_file" latest.json --clobber --repo "$GITHUB_REPOSITORY"
          fi
