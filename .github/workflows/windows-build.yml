name: Windows installer
on:
  workflow_run:
    workflows: ["Android APK and releases"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installers
  cancel-in-progress: false

jobs:
  windows:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve latest Linka release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = (gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name).Trim()
          if (-not $tag) { throw "No published Linka Android release was found." }
          $version = $tag.TrimStart("v")
          if ($version -notmatch "^\\d+\\.\\d+\\.\\d+$") { throw "Unexpected release tag: $tag" }
          "LINKA_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VITE_LINKA_DESKTOP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $configPath = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/tauri.conf.json"
          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          $config.version = $version
          $config | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8 $configPath
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Install desktop tooling
        working-directory: apps/desktop
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        working-directory: apps/desktop
        run: npm run build
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linka-Windows-x64-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish installer to the latest Linka release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=(apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if [[ ! -f "${files[0]:-}" ]]; then
            echo "::error::No Windows NSIS installer was produced."
            exit 1
          fi
          cp "${files[0]}" Linka-Windows-x64-setup.exe
          tag="${LINKA_RELEASE_TAG:-$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)}"
          echo "Uploading Windows installer to release $tag"
          gh release upload "$tag" Linka-Windows-x64-setup.exe --clobber --repo "$GITHUB_REPOSITORY"
