name: Android APK and releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write

# Serialize Android builds: the signing-key cache must never be initialized by
# two concurrent runners, or different APKs could be signed with different keys.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # The signing key is persisted in Actions cache. Never rotate it silently:
      # a cache miss must fail the release rather than publish an incompatible APK.
      - name: Restore Linka update signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: linka-android-debug-signing-v1

      # The Android Gradle plugin does not necessarily create debug.keystore
      # for a release build that reuses the debug signing config. Create it
      # explicitly on the first cache miss so actions/cache can persist it.
      - name: Require preserved Linka signing key
        shell: bash
        run: |
          set -euo pipefail
          key="$HOME/.android/debug.keystore"
          if [[ ! -s "$key" ]]; then
            echo "::error::No preserved Linka signing key in Actions cache. Refusing to generate a replacement key or publish an incompatible APK."
            exit 1
          fi
          keytool -list -keystore "$key" -storepass android -alias androiddebugkey >/dev/null
          fingerprint="$(keytool -list -v -keystore "$key" -storepass android -alias androiddebugkey | awk -F ': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          if [[ -z "$fingerprint" ]]; then
            echo "Could not read Linka signing certificate fingerprint."
            exit 1
          fi
          echo "SIGNING_CERT_SHA256=$fingerprint" >> "$GITHUB_ENV"
          echo "Linka signing certificate SHA-256: $fingerprint"

      - name: Build Android APK
        working-directory: apps/android
        env:
          LINKA_SUPABASE_URL: ${{ vars.LINKA_SUPABASE_URL }}
          LINKA_SUPABASE_PUBLISHABLE_KEY: ${{ vars.LINKA_SUPABASE_PUBLISHABLE_KEY }}
          LINKA_VERSION_CODE: ${{ github.run_number }}
          LINKA_VERSION_NAME: 0.4.${{ github.run_number }}
        run: |
          mkdir -p ~/.android
          gradle testDebugUnitTest assembleRelease -PlinkaVersionCode="$LINKA_VERSION_CODE" -PlinkaVersionName="$LINKA_VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Linka-Android-$LINKA_VERSION_NAME.apk"

      - name: Verify APK signing certificate
        shell: bash
        working-directory: apps/android
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk" ]]; then
            echo "Android SDK path is not configured."
            exit 1
          fi
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "apksigner was not found in the Android SDK build-tools."
            exit 1
          fi
          report="$("$apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$report"
          actual="$(printf '%s\n' "$report" | awk -F ': ' '/certificate SHA-256 digest:/{print tolower($NF); exit}')"
          if [[ -z "$actual" || "$actual" != "$SIGNING_CERT_SHA256" ]]; then
            echo "APK signature does not match the preserved Linka signing key."
            echo "Expected: $SIGNING_CERT_SHA256"
            echo "Actual:   $actual"
            exit 1
          fi
          echo "APK signature matches the persistent Linka signing key."
          
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linka-Android-${{ github.run_number }}
          path: apps/android/app/build/outputs/apk/release/Linka-Android-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.${{ github.run_number }}
          name: Linka Android v0.4.${{ github.run_number }}
          body: |
            What's new in Linka ${{ github.run_number }}:
            - Replaced the ambient sphere and generated background sound with one unified Linka twilight-forest theme.
            - Added a slowly moving dusk-forest video, subtle wind-like motion, and delicate film grain behind the interface.
            - Set the exact soundtrack supplied by the user, “как всё заебало..”, as the default track; migrated stored playlists to select it first while keeping personal tracks.
            - Added a compact bottom-right player and expanded playlist with play/pause, previous/next, volume, and local track import.
            - Users can choose a personal photo or video background; personal media remains on-device and is not included in Linka capture sync.
            - Removed alternate theme and accent selectors so the same twilight appearance is used across Android, Web, and Windows.
            - Kept animated text entry, local-first capture storage, backup import/export, and existing account/sync flows.
            - Install on Android 8.0 or newer. Android may ask you to confirm installation.
          files: apps/android/app/build/outputs/apk/release/Linka-Android-*.apk
          draft: false
          prerelease: false
          make_latest: true
