name: Android APK and releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write

# Give each run its own group so a stale runner cannot hold later Android builds.
concurrency:
  group: android-apk-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Reuse one debug signing key so APKs from consecutive CI runs can update
      # an existing CI-installed app. This is a hobby-project convenience, not
      # production-grade signing; a Play Store release needs a protected key.
      - name: Restore Linka update signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: linka-android-debug-signing-v1

      - name: Build Android APK
        working-directory: apps/android
        env:
          LINKA_VERSION_CODE: ${{ github.run_number }}
          LINKA_VERSION_NAME: 0.4.${{ github.run_number }}
        run: |
          mkdir -p ~/.android
          gradle testDebugUnitTest assembleRelease -PlinkaVersionCode="$LINKA_VERSION_CODE" -PlinkaVersionName="$LINKA_VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Linka-Android-$LINKA_VERSION_NAME.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linka-Android-${{ github.run_number }}
          path: apps/android/app/build/outputs/apk/release/Linka-Android-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.${{ github.run_number }}
          name: Linka Android v0.4.${{ github.run_number }}
          body: |
            What's new in this Android build:
            - Optimized release build with R8 code shrinking and resource shrinking.
            - The inbox renders a limited batch of items at a time to reduce initial UI work.
            - Automated unit tests cover link/note filters, case-insensitive search, and pinned ordering.
            - Shorter, calmer page transitions designed to reduce visual jumping.
            - Update prompts are localized and include release notes.
            - The app requests the display's highest supported refresh rate; actual FPS remains device-controlled.
            - Motion remains native and can be disabled in Settings.
            - Install the APK on Android 8.0 or newer. Android may ask you to confirm installation.
          files: apps/android/app/build/outputs/apk/release/Linka-Android-*.apk
          draft: false
          prerelease: false
          make_latest: true
