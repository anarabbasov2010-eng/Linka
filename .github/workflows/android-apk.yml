name: Android APK and releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write

# Serialize Android builds: the signing-key cache must never be initialized by
# two concurrent runners, or different APKs could be signed with different keys.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Reuse one debug signing key so APKs from consecutive CI runs can update
      # an existing CI-installed app. This is a hobby-project convenience, not
      # production-grade signing; a Play Store release needs a protected key.
      - name: Restore Linka update signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: linka-android-debug-signing-v1

      # The Android Gradle plugin does not necessarily create debug.keystore
      # for a release build that reuses the debug signing config. Create it
      # explicitly on the first cache miss so actions/cache can persist it.
      - name: Ensure Linka signing key exists
        shell: bash
        run: |
          set -euo pipefail
          key="$HOME/.android/debug.keystore"
          mkdir -p "$(dirname "$key")"
          if [[ ! -s "$key" ]]; then
            echo "No cached Linka signing key found; generating the persistent CI key."
            keytool -genkeypair -v \
              -keystore "$key" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$key" -storepass android -alias androiddebugkey >/dev/null
          fingerprint="$(keytool -list -v -keystore "$key" -storepass android -alias androiddebugkey | awk -F ': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          if [[ -z "$fingerprint" ]]; then
            echo "Could not read Linka signing certificate fingerprint."
            exit 1
          fi
          echo "SIGNING_CERT_SHA256=$fingerprint" >> "$GITHUB_ENV"
          echo "Linka signing certificate SHA-256: $fingerprint"

      - name: Build Android APK
        working-directory: apps/android
        env:
          LINKA_VERSION_CODE: ${{ github.run_number }}
          LINKA_VERSION_NAME: 0.4.${{ github.run_number }}
        run: |
          mkdir -p ~/.android
          gradle testDebugUnitTest assembleRelease -PlinkaVersionCode="$LINKA_VERSION_CODE" -PlinkaVersionName="$LINKA_VERSION_NAME"
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Linka-Android-$LINKA_VERSION_NAME.apk"

      - name: Verify APK signing certificate
        shell: bash
        working-directory: apps/android
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk" ]]; then
            echo "Android SDK path is not configured."
            exit 1
          fi
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "apksigner was not found in the Android SDK build-tools."
            exit 1
          fi
          report="$("$apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$report"
          actual="$(printf '%s\n' "$report" | awk -F ': ' '/certificate SHA-256 digest:/{print tolower($2); exit}')"
          if [[ -z "$actual" || "$actual" != "$SIGNING_CERT_SHA256" ]]; then
            echo "APK signature does not match the preserved Linka signing key."
            echo "Expected: $SIGNING_CERT_SHA256"
            echo "Actual:   $actual"
            exit 1
          fi
          echo "APK signature matches the persistent Linka signing key."
          
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linka-Android-${{ github.run_number }}
          path: apps/android/app/build/outputs/apk/release/Linka-Android-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.${{ github.run_number }}
          name: Linka Android v0.4.${{ github.run_number }}
          body: |
            What's new in this Android build:
            - Optimized release build with R8 code shrinking and resource shrinking.
            - The inbox renders a limited batch of items at a time to reduce initial UI work.
            - Automated unit tests cover link/note filters, case-insensitive search, and pinned ordering.
            - Shorter, calmer page transitions designed to reduce visual jumping.
            - Update prompts are localized and include release notes.
            - The app requests the display's highest supported refresh rate; actual FPS remains device-controlled.
            - Motion remains native and can be disabled in Settings.
            - Install the APK on Android 8.0 or newer. Android may ask you to confirm installation.
          files: apps/android/app/build/outputs/apk/release/Linka-Android-*.apk
          draft: false
          prerelease: false
          make_latest: true
